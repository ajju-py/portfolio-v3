<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#915EFF" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagon Container -->
  <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" fill="#0b1120" stroke="url(#borderGrad)" stroke-width="3" filter="url(#glow)"/>
  <polygon points="50,10 86,30 86,70 50,90 14,70 14,30" fill="#0d1829" opacity="0.8"/>
  
  <!-- Stylized AT Monogram for Ajay Tandale -->
  <!-- Letter A -->
  <path d="M 33 68 L 47 28 L 53 28 L 67 68 L 58 68 L 54.5 57 L 45.5 57 L 42 68 Z M 48 49 L 52 49 L 50 37 Z" fill="url(#cloudGrad)" />
  
  <!-- Integrated T Crossbar and Stem accent -->
  <path d="M 30 33 L 70 33 L 70 37 L 30 37 Z" fill="#00d2ff" opacity="0.9" />
  <circle cx="50" cy="18" r="3" fill="#00f2fe" filter="url(#glow)"/>
</svg>