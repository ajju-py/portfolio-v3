<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e1828"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg2)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Terminal Window Mockup -->
  <rect x="50" y="45" width="700" height="390" rx="12" fill="#080c14" stroke="#334155" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="50" y="45" width="700" height="38" rx="12" fill="#0f172a"/>
  <circle cx="75" cy="64" r="6" fill="#ef4444"/>
  <circle cx="95" cy="64" r="6" fill="#f59e0b"/>
  <circle cx="115" cy="64" r="6" fill="#10b981"/>
  <text x="400" y="69" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">root@rhel9-node01: ~/server-hardening</text>

  <!-- CLI Content -->
  <g font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">
    <text x="80" y="120" fill="#22c55e">[root@rhel9 ~]# firewall-cmd --get-active-zones</text>
    <text x="80" y="145" fill="#f1f5f9">internal: interfaces=ens33 | services=ssh,custom-port</text>
    <text x="80" y="170" fill="#22c55e">[root@rhel9 ~]# sestatus</text>
    <text x="80" y="195" fill="#f87171">SELinux status:                 enabled</text>
    <text x="80" y="215" fill="#f87171">Current mode:                   enforcing</text>
    <text x="80" y="235" fill="#f87171">Mode from config file:          enforcing</text>
    
    <text x="80" y="270" fill="#22c55e">[root@rhel9 ~]# ./user-audit-hardening.sh --verify</text>
    <text x="80" y="295" fill="#38bdf8">[INFO] Validating least-privilege sudoers permissions...</text>
    <text x="80" y="320" fill="#38bdf8">[INFO] Checking SSH key-based auth &amp; root password lock: PASS</text>
    <text x="80" y="345" fill="#38bdf8">[INFO] systemd journalctl retention policy: CONFIGURED</text>
    <text x="80" y="380" fill="#10b981">✓ System Security Baseline Hardening Complete (RHEL 9.x)</text>
  </g>

  <!-- Floating Badges -->
  <rect x="530" y="110" width="190" height="42" rx="8" fill="#ee0000"/>
  <text x="625" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">RHEL 9 Hardened</text>

  <rect x="530" y="165" width="190" height="42" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text x="625" y="191" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-weight="bold" font-size="13">SELinux Enforcing</text>

  <rect x="530" y="220" width="190" height="42" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="625" y="246" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-weight="bold" font-size="13">Firewalld &amp; SSH Auth</text>
</svg>
