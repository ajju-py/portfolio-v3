<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="terragrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#844fba"/>
      <stop offset="100%" stop-color="#5c4ee5"/>
    </linearGradient>
    <linearGradient id="awsgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg1)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Terminal Window Mockup -->
  <rect x="50" y="45" width="700" height="390" rx="12" fill="#0c101d" stroke="#1e293b" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="50" y="45" width="700" height="38" rx="12" fill="#151b2e"/>
  <circle cx="75" cy="64" r="6" fill="#ef4444"/>
  <circle cx="95" cy="64" r="6" fill="#f59e0b"/>
  <circle cx="115" cy="64" r="6" fill="#10b981"/>
  <text x="400" y="69" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">wsl2@ubuntu: ~/iac-labs/aws-terraform</text>

  <!-- CLI Content -->
  <g font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">
    <text x="80" y="120" fill="#38bdf8">$ terraform plan -out=tfplan.binary</text>
    <text x="80" y="145" fill="#a78bfa">Terraform used the selected providers to generate the following execution plan:</text>
    
    <text x="80" y="175" fill="#34d399">+ resource "aws_s3_bucket" "practice_store" {</text>
    <text x="110" y="200" fill="#cbd5e1">+ bucket                  = "ajju-local-practice-bucket"</text>
    <text x="110" y="225" fill="#cbd5e1">+ force_destroy           = false</text>
    <text x="110" y="250" fill="#cbd5e1">+ object_lock_enabled     = false</text>
    <text x="80" y="275" fill="#34d399">}</text>

    <text x="80" y="310" fill="#e2e8f0">Plan: 1 to add, 0 to change, 0 to destroy.</text>
    <text x="80" y="340" fill="#38bdf8">$ aws --endpoint-url=http://localhost:4566 s3 ls</text>
    <text x="80" y="365" fill="#f59e0b">2026-03-12 14:22:01 ajju-local-practice-bucket [LOCAL EMULATOR]</text>
    <text x="80" y="400" fill="#10b981">✓ Emulator Health: HEALTHY | Local IaC Workspace Active</text>
  </g>

  <!-- Floating Tech Badges -->
  <rect x="540" y="110" width="180" height="42" rx="8" fill="url(#awsgrad)"/>
  <text x="630" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">AWS CLI / S3</text>

  <rect x="540" y="165" width="180" height="42" rx="8" fill="url(#terragrad)"/>
  <text x="630" y="191" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Terraform IaC</text>

  <rect x="540" y="220" width="180" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="630" y="246" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13">WSL2 Emulator Lab</text>
</svg>
