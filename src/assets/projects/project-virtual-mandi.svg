<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg4)"/>

  <rect x="50" y="45" width="700" height="390" rx="12" fill="#021c15" stroke="#059669" stroke-width="2"/>
  <rect x="50" y="45" width="700" height="38" rx="12" fill="#064e3b"/>
  <circle cx="75" cy="64" r="6" fill="#ef4444"/>
  <circle cx="95" cy="64" r="6" fill="#f59e0b"/>
  <circle cx="115" cy="64" r="6" fill="#10b981"/>
  <text x="400" y="69" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="13">Virtual Mandi — Digital Agricultural Marketplace (Academic Project)</text>

  <!-- Marketplace Visual Cards -->
  <rect x="90" y="110" width="290" height="135" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="110" y="140" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="15">Producer Direct Portal</text>
  <text x="110" y="165" fill="#e2e8f0" font-family="sans-serif" font-size="12">• Crop inventory &amp; real-time lot listing</text>
  <text x="110" y="190" fill="#e2e8f0" font-family="sans-serif" font-size="12">• Transparent price discovery mechanism</text>
  <text x="110" y="215" fill="#a7f3d0" font-family="sans-serif" font-size="11">Direct farmer-to-buyer transactions</text>

  <rect x="420" y="110" width="290" height="135" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="440" y="140" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="15">Wholesale Buyer Interface</text>
  <text x="440" y="165" fill="#e2e8f0" font-family="sans-serif" font-size="12">• Bulk catalog search &amp; category filters</text>
  <text x="440" y="190" fill="#e2e8f0" font-family="sans-serif" font-size="12">• Transaction verification flow logic</text>
  <text x="440" y="215" fill="#a7f3d0" font-family="sans-serif" font-size="11">Elimination of middleman markups</text>

  <!-- Bottom System Logic Card -->
  <rect x="90" y="265" width="620" height="140" rx="8" fill="#03251d"/>
  <text x="120" y="300" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Architecture &amp; System Flow</text>
  <text x="120" y="330" fill="#cbd5e1" font-family="sans-serif" font-size="12">Designed around entity-relationship models, transaction lifecycle states (Created → Reserved → Settled),</text>
  <text x="120" y="355" fill="#cbd5e1" font-family="sans-serif" font-size="12">and robust relational data schema. Developed as a final-year academic engineering capstone.</text>
  <text x="120" y="388" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">Category: Academic Concept &amp; Prototype</text>
</svg>
